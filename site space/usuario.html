<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Orange-Usuário</title>
    <link rel="icon" href="img.site.jpg.webp" type="image/webp">
    <link rel="stylesheet" href="user.css">
</head>
<body>
    <header>
        <div><a href="#"><img class="imagem-site" src="img.site.jpg.webp"></a></div>
        <div><a href="#"><h1>Space Orange</h1></a></div>
    </header>

    <section id="contato">
        <h2>Cadastre-se</h2>
        <form action="#">
            <label for="nome">Nome de usuário:</label>
            <input type="text" id="nome" name="nome" placeholder="Nome" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <label for="numero">Celular:</label>
            <input type="tel" id="tel" name="tel" placeholder="(00) 00000-0000" required pattern="\(\d{2}\) \d{5}-\d{4}">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="senha" required>
            <label for="senha">Confirmar senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Confirmar" required>
            <button type="submit">Enviar</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2024 Space Orange. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
